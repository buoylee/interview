[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-handson-lab"
version = "0.1.0"
description = "Evidence-backed PostgreSQL lab for the SQLAlchemy hands-on tutorial"
requires-python = ">=3.11,<3.15"
dependencies = [
    "sqlalchemy==2.0.51",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL 18 Compose service",
]
timeout = 10

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["order_service"]
